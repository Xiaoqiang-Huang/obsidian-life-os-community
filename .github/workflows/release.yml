name: Release

on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify and build plugin
        run: npm test

      - name: Validate source and release version
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if ! [[ "$tag" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Release tag must be an exact semantic version without a v prefix: $tag"
            exit 1
          fi

          package_version="$(node -p "require('./package.json').version")"
          lock_version="$(node -p "require('./package-lock.json').packages[''].version")"
          manifest_version="$(node -p "require('./manifest.json').version")"
          versions_min_app="$(node -p "require('./versions.json')[require('./manifest.json').version] || ''")"
          manifest_min_app="$(node -p "require('./manifest.json').minAppVersion")"

          if [ "$package_version" != "$tag" ] || [ "$lock_version" != "$tag" ] || [ "$manifest_version" != "$tag" ]; then
            echo "Version mismatch: tag=$tag package=$package_version lock=$lock_version manifest=$manifest_version"
            exit 1
          fi
          if [ -z "$versions_min_app" ] || [ "$versions_min_app" != "$manifest_min_app" ]; then
            echo "versions.json does not map $tag to manifest minAppVersion $manifest_min_app"
            exit 1
          fi
          if git ls-files --error-unmatch main.js >/dev/null 2>&1; then
            echo "main.js must be generated by CI and must not be tracked on the default branch"
            exit 1
          fi
          test -s main.js
          test -s manifest.json
          test -s styles.css

      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" main.js manifest.json styles.css --clobber
          else
            gh release create "$tag" main.js manifest.json styles.css \
              --title "Life OS Assistant $tag" \
              --generate-notes
          fi
